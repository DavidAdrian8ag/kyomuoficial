<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KYOMU | Anime & Comic Apparel</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Roboto:wght@300;400;700&display=swap"
        rel="stylesheet">
    <style>
        /* --- 1. CONFIGURACIÓN BASE & ESTÉTICA CYBERPUNK --- */
        :root {
            --bg-dark: #0f0f11;
            --bg-card: #1a1a1d;
            --text-main: #ffffff;
            --text-dim: #a0a0a0;
            --accent-primary: #8a2be2;
            /* Violeta Neón */
            --accent-secondary: #00e5ff;
            /* Cian Cyberpunk */
            --font-title: 'Orbitron', sans-serif;
            --font-body: 'Roboto', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font-body);
            overflow-x: hidden;
        }

        a {
            text-decoration: none;
            color: inherit;
            transition: 0.3s;
        }

        ul {
            list-style: none;
        }

        /* --- 2. NAVEGACIÓN --- */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            background: rgba(15, 15, 17, 0.95);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo {
            font-family: var(--font-title);
            font-size: 1.5rem;
            letter-spacing: 2px;
            color: var(--text-main);
            text-transform: uppercase;
        }

        .logo span {
            color: var(--accent-primary);
        }

        .cart-btn {
            background: transparent;
            border: 1px solid var(--text-main);
            color: var(--text-main);
            padding: 8px 15px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        /* --- 3. HERO SECTION (Impacto Visual) --- */
        .hero {
            height: 90vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.8)),
                url('https://images.unsplash.com/photo-1613376023733-0a73315d9b06?q=80&w=1470&auto=format&fit=crop');
            /* NOTA: Cambia la URL de arriba por una foto de portada de anime/comics */
            background-size: cover;
            background-position: center;
            padding: 20px;
        }

        .hero h1 {
            font-family: var(--font-title);
            font-size: clamp(2.5rem, 8vw, 5rem);
            text-transform: uppercase;
            line-height: 1.1;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(138, 43, 226, 0.5);
        }

        .hero p {
            font-size: 1.2rem;
            max-width: 600px;
            color: var(--text-dim);
            margin-bottom: 30px;
        }

        .cta-btn {
            padding: 15px 40px;
            background: var(--accent-primary);
            color: white;
            font-weight: bold;
            font-family: var(--font-title);
            border: none;
            clip-path: polygon(10% 0, 100% 0, 100% 70%, 90% 100%, 0 100%, 0 30%);
            /* Forma futurista */
            cursor: pointer;
            transition: 0.3s;
        }

        .cta-btn:hover {
            background: var(--accent-secondary);
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.4);
        }

        /* --- 4. SISTEMA DE FILTROS --- */
        .filters {
            display: flex;
            justify-content: center;
            gap: 15px;
            padding: 50px 20px 20px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: transparent;
            border: 1px solid var(--text-dim);
            color: var(--text-dim);
            padding: 8px 20px;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 0.8rem;
            transition: 0.3s;
        }

        .filter-btn.active,
        .filter-btn:hover {
            border-color: var(--accent-primary);
            color: var(--accent-primary);
            background: rgba(138, 43, 226, 0.1);
        }

        /* --- 5. GRID DE PRODUCTOS (Responsive) --- */
        .gallery-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px 5%;
            margin-bottom: 80px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }

        /* Tarjeta de Producto */
        .product-card {
            background: var(--bg-card);
            border-radius: 8px;
            overflow: hidden;
            transition: 0.4s;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .product-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-primary);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .img-container {
            width: 100%;
            height: 350px;
            overflow: hidden;
            position: relative;
        }

        .img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* Asegura que la foto llene el espacio sin deformarse */
            transition: 0.5s;
        }

        .product-card:hover .img-container img {
            transform: scale(1.1);
        }

        .card-details {
            padding: 20px;
        }

        .category-tag {
            font-size: 0.7rem;
            color: var(--accent-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
            display: block;
        }

        .product-title {
            font-size: 1.1rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .price-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
        }

        .price {
            font-size: 1.2rem;
            color: var(--text-main);
        }

        .buy-mini-btn {
            background: white;
            color: black;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .buy-mini-btn:hover {
            background: var(--accent-primary);
            color: white;
        }

        /* --- FOOTER --- */
        footer {
            background: #000;
            padding: 40px;
            text-align: center;
            border-top: 2px solid var(--accent-primary);
        }

        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2.5rem;
            }

            .products-grid {
                grid-template-columns: 1fr 1fr;
                gap: 15px;
            }

            /* 2 columnas en móvil */
            .img-container {
                height: 200px;
            }

            /* Imagen más pequeña en móvil */
            .card-details {
                padding: 15px;
            }

            .buy-mini-btn {
                width: 30px;
                height: 30px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <div class="logo">KYO<span>MU</span></div>
        <button class="cart-btn" onclick="alert('Funcionalidad de carrito pronto...')">
            CARRITO (0)
        </button>
    </nav>

    <header class="hero">
        <h1>Wear Your<br>Obsession</h1>
        <p>Anime. Cómics. Streetwear. La mejor calidad gráfica en tus camisetas.</p>
        <button class="cta-btn" onclick="document.getElementById('shop-section').scrollIntoView({behavior: 'smooth'})">
            VER COLECCIÓN
        </button>
    </header>

    <section id="shop-section">
        <div class="filters">
            <button class="filter-btn active" onclick="filterProducts('all')">Todos</button>
            <button class="filter-btn" onclick="filterProducts('anime')">Anime</button>
            <button class="filter-btn" onclick="filterProducts('comics')">Comics</button>
            <button class="filter-btn" onclick="filterProducts('original')">Originals</button>
        </div>
    </section>

    <div class="gallery-container">
        <div class="products-grid" id="product-grid">
        </div>
    </div>

    <footer>
        <p style="margin-bottom: 10px; font-family: var(--font-title);">KYOMU OFFICIAL</p>
        <p style="color: #666; font-size: 0.9rem;">Envíos a todo México 🇲🇽</p>
    </footer>

    <script>
        /* ================================================================
        AREA DE EDICIÓN FÁCIL
        Para agregar productos, solo copia un bloque entre { } y cambia los datos.
        categories disponibles: 'anime', 'comics', 'original'
        ================================================================
        */
        const products = [
            {
                id: 1,
                title: "Demon Slayer - Tanjiro Breath",
                category: "anime",
                price: "$350.00",
                image: "https://images.unsplash.com/photo-1576566588028-4147f3842f27?q=80&w=1000&auto=format&fit=crop" // Pon aquí tu link de foto real
            },
            {
                id: 2,
                title: "Spider-Verse Glitch Tee",
                category: "comics",
                price: "$380.00",
                image: "https://images.unsplash.com/photo-1503341455253-b2e72333dbdb?q=80&w=1000&auto=format&fit=crop"
            },
            {
                id: 3,
                title: "Kyomu Kanji Minimalist",
                category: "original",
                price: "$400.00",
                image: "https://images.unsplash.com/photo-1583743814966-8936f5b7be1a?q=80&w=1000&auto=format&fit=crop"
            },
            {
                id: 4,
                title: "Akira Neo-Tokyo Vibe",
                category: "anime",
                price: "$390.00",
                image: "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?q=80&w=1000&auto=format&fit=crop"
            },
            {
                id: 5,
                title: "Batman The Dark Knight",
                category: "comics",
                price: "$360.00",
                image: "https://images.unsplash.com/photo-1620799140408-ed5341cd2431?q=80&w=1000&auto=format&fit=crop"
            },
            {
                id: 6,
                title: "Berserk Eclipse Edition",
                category: "anime",
                price: "$420.00",
                image: "https://images.unsplash.com/photo-1562157873-818bc0726f68?q=80&w=1000&auto=format&fit=crop"
            }
        ];

        /* ================================================================
           LÓGICA DEL SISTEMA (NO NECESITAS TOCAR ESTO A MENOS QUE SEPAS JS)
           ================================================================ */

        const grid = document.getElementById('product-grid');
        const btns = document.querySelectorAll('.filter-btn');

        // Función para mostrar productos
        function renderProducts(filter = 'all') {
            grid.innerHTML = ''; // Limpiar grid

            const filteredData = filter === 'all'
                ? products
                : products.filter(p => p.category === filter);

            filteredData.forEach(product => {
                const card = document.createElement('article');
                card.className = 'product-card';
                card.innerHTML = `
                    <div class="img-container">
                        <img src="${product.image}" alt="${product.title}" loading="lazy">
                    </div>
                    <div class="card-details">
                        <span class="category-tag">${product.category}</span>
                        <h3 class="product-title">${product.title}</h3>
                        <div class="price-row">
                            <span class="price">${product.price}</span>
                            <button class="buy-mini-btn" onclick="buyProduct('${product.title}')">
                                +
                            </button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Función de filtrado
        function filterProducts(category) {
            // Actualizar estilo de botones
            btns.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            // Renderizar
            renderProducts(category);
        }

        // Función de compra (Redirección a WhatsApp)
        function buyProduct(title) {
            const phone = "5215555555555"; // CAMBIA ESTO POR EL NUMERO DE KYOMU
            const text = `Hola Kyomu! Me interesa la camiseta modelo: ${title}`;
            const url = `https://wa.me/${phone}?text=${encodeURIComponent(text)}`;
            window.open(url, '_blank');
        }

        // Cargar todo al inicio
        renderProducts();

    </script>
</body>

</html>
