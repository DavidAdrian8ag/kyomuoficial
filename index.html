<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KYOMU | Streetwear Archive</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Oswald:wght@500;700&display=swap"
        rel="stylesheet">

    <style>
        /* --- 1. CORE ESTÉTICO (ESTILO LVCRECIA) --- */
        :root {
            --bg-color: #050505;
            /* Negro profundo casi absoluto */
            --card-bg: #000000;
            --text-main: #ffffff;
            --text-muted: #888888;
            --border-color: #222222;
            --accent: #ffffff;
            /* En este estilo, el acento es blanco, no color */
            --font-display: 'Oswald', sans-serif;
            --font-body: 'Inter', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-body);
            font-size: 14px;
            /* Letra pequeña y elegante */
            overflow-x: hidden;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        img {
            width: 100%;
            display: block;
        }

        /* --- 2. HEADER MINIMALISTA --- */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(5, 5, 5, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            z-index: 1000;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-family: var(--font-display);
            font-size: 1.5rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 700;
        }

        .nav-icons {
            display: flex;
            gap: 20px;
            font-size: 0.9rem;
            text-transform: uppercase;
            font-weight: 600;
        }

        /* --- 3. CATEGORY SELECTOR (SCROLL HORIZONTAL) --- */
        .category-bar {
            margin-top: 70px;
            /* Espacio para el header fijo */
            padding: 15px 20px;
            overflow-x: auto;
            white-space: nowrap;
            display: flex;
            gap: 15px;
            border-bottom: 1px solid var(--border-color);
            scrollbar-width: none;
            /* Ocultar scrollbar en Firefox */
        }

        .category-bar::-webkit-scrollbar {
            display: none;
        }

        /* Ocultar en Chrome */

        .cat-btn {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 8px 20px;
            font-family: var(--font-body);
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.3s;
        }

        .cat-btn.active,
        .cat-btn:hover {
            color: var(--bg-color);
            background: var(--text-main);
            border-color: var(--text-main);
        }

        /* --- 4. PRODUCT GRID (ESTILO CALLEJERO) --- */
        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 20px;
        }

        .grid {
            display: grid;
            /* Móvil: 2 columnas exactas como Lucrecia/Apps de moda */
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            /* Espacio muy fino entre productos */
            row-gap: 40px;
        }

        .product-card {
            cursor: pointer;
            position: relative;
        }

        .image-wrapper {
            position: relative;
            background: #111;
            aspect-ratio: 3 / 4;
            /* Formato vertical de moda */
            overflow: hidden;
            margin-bottom: 12px;
        }

        .image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        /* Hover effect sutil */
        .product-card:hover .image-wrapper img {
            transform: scale(1.03);
        }

        /* Etiquetas (Sold Out / New) */
        .badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: var(--text-main);
            color: var(--bg-color);
            padding: 4px 8px;
            font-size: 0.6rem;
            text-transform: uppercase;
            font-weight: 700;
            z-index: 2;
        }

        .badge-red {
            background: #ff3333;
            color: white;
        }

        .product-info {
            text-align: left;
        }

        .p-title {
            font-family: var(--font-body);
            font-weight: 400;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
            line-height: 1.2;
        }

        .p-price {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-main);
        }

        .p-meta {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 2px;
            text-transform: uppercase;
        }

        /* Botón de compra rápido flotante en móvil (opcional) o integrado */
        .quick-add {
            margin-top: 10px;
            width: 100%;
            padding: 10px;
            background: transparent;
            border: 1px solid var(--text-main);
            color: var(--text-main);
            text-transform: uppercase;
            font-size: 0.7rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .quick-add:hover {
            background: var(--text-main);
            color: var(--bg-color);
        }

        /* --- 5. FOOTER SIMPLE --- */
        footer {
            padding: 60px 20px;
            border-top: 1px solid var(--border-color);
            margin-top: 50px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .marquee {
            overflow: hidden;
            white-space: nowrap;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-color);
            border-top: 1px solid var(--border-color);
            margin-bottom: 30px;
        }

        .marquee span {
            display: inline-block;
            padding-left: 100%;
            animation: marquee 15s linear infinite;
            font-family: var(--font-display);
            text-transform: uppercase;
            font-size: 1.2rem;
            color: var(--text-muted);
        }

        @keyframes marquee {
            0% {
                transform: translate(0, 0);
            }

            100% {
                transform: translate(-100%, 0);
            }
        }

        /* RESPONSIVE DESKTOP */
        @media (min-width: 1024px) {
            .grid {
                grid-template-columns: repeat(4, 1fr);
                /* 4 columnas en PC */
                gap: 20px;
            }

            .p-title {
                font-size: 0.95rem;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="brand">KYOMU.</div>
        <div class="nav-icons">
            <a href="#">MXN</a>
            <a href="#">CARRITO (0)</a>
        </div>
    </header>

    <nav class="category-bar">
        <button class="cat-btn active" onclick="filterBy('all')">View All</button>
        <button class="cat-btn" onclick="filterBy('tees')">T-Shirts</button>
        <button class="cat-btn" onclick="filterBy('hoodies')">Hoodies</button>
        <button class="cat-btn" onclick="filterBy('anime')">Anime Icons</button>
        <button class="cat-btn" onclick="filterBy('comics')">Comics</button>
    </nav>

    <main class="container">
        <div class="marquee">
            <span>ENVÍOS GRATIS EN COMPRAS MAYORES A $999 MXN /// NEW DROP AVAILABLE NOW /// KYOMU WORLDWIDE</span>
        </div>

        <div id="product-grid" class="grid">
        </div>
    </main>

    <footer>
        <div style="text-transform: uppercase; font-size: 0.8rem; color: #555;">
            <p>Kyomu Official &copy; 2024</p>
            <p>Diseñado en México</p>
        </div>
        <div style="display: flex; gap: 15px;">
            <a href="#" style="border-bottom: 1px solid white; padding-bottom: 2px;">Instagram</a>
            <a href="#" style="border-bottom: 1px solid white; padding-bottom: 2px;">TikTok</a>
        </div>
    </footer>

    <script>
        /* ================================================================
           BASE DE DATOS EDITABLE
           Instrucciones:
           1. Copia un bloque {...}
           2. Pega después de la coma
           3. Cambia los datos.
           
           IMPORTANTE: Usa imágenes verticales (aspecto 3:4) para mejor look.
           ================================================================
        */
        const inventory = [
            {
                id: 1,
                name: "EVANGELION UNIT-01 TEE",
                price: 450,
                type: "tees",
                collection: "anime",
                image: "https://images.unsplash.com/photo-1583743814966-8936f5b7be1a?q=80&w=1000&auto=format&fit=crop",
                tag: "Best Seller"
            },
            {
                id: 2,
                name: "GUTS BERSERKER OVERSIZE",
                price: 550,
                type: "tees",
                collection: "anime",
                image: "https://images.unsplash.com/photo-1576566588028-4147f3842f27?q=80&w=1000&auto=format&fit=crop",
                tag: "Low Stock"
            },
            {
                id: 3,
                name: "SPIDER-PUNK HOODIE",
                price: 1200,
                type: "hoodies",
                collection: "comics",
                image: "https://images.unsplash.com/photo-1556905055-8f358a7a47b2?q=80&w=1000&auto=format&fit=crop",
                tag: ""
            },
            {
                id: 4,
                name: "AKIRA NEO-TOKYO TEE",
                price: 450,
                type: "tees",
                collection: "anime",
                image: "https://images.unsplash.com/photo-1503342394128-c104d54dba01?q=80&w=1000&auto=format&fit=crop",
                tag: "New Arrival"
            },
            {
                id: 5,
                name: "BATMAN GOTHAM KNIGHT",
                price: 480,
                type: "tees",
                collection: "comics",
                image: "https://images.unsplash.com/photo-1618354691373-d851c5c3a990?q=80&w=1000&auto=format&fit=crop",
                tag: ""
            },
            {
                id: 6,
                name: "JUJUTSU KAISEN DOMAIN",
                price: 450,
                type: "tees",
                collection: "anime",
                image: "https://images.unsplash.com/photo-1529374255404-311a2a4f1fd9?q=80&w=1000&auto=format&fit=crop",
                tag: "Sold Out"
            }
        ];

        const gridContainer = document.getElementById('product-grid');
        const filterButtons = document.querySelectorAll('.cat-btn');

        // Función Principal de Renderizado
        function render(filter = 'all') {
            gridContainer.innerHTML = '';

            const filtered = filter === 'all'
                ? inventory
                : inventory.filter(item => item.type === filter || item.collection === filter);

            filtered.forEach(item => {
                // Lógica de etiqueta
                let badgeHTML = '';
                if (item.tag) {
                    const colorClass = item.tag === 'Sold Out' || item.tag === 'Low Stock' ? 'badge-red' : '';
                    badgeHTML = `<span class="badge ${colorClass}">${item.tag}</span>`;
                }

                // Creación de la tarjeta HTML
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div class="image-wrapper">
                        ${badgeHTML}
                        <img src="${item.image}" alt="${item.name}" loading="lazy">
                    </div>
                    <div class="product-info">
                        <h3 class="p-title">${item.name}</h3>
                        <div class="p-price">$${item.price} MXN</div>
                        <div class="p-meta">${item.collection} Series</div>
                        <button class="quick-add" onclick="checkout('${item.name}', ${item.price})">
                            AGREGAR AL CARRITO
                        </button>
                    </div>
                `;
                gridContainer.appendChild(card);
            });
        }

        // Sistema de Filtrado
        function filterBy(criteria) {
            // Actualizar botones visualmente
            filterButtons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            // Renderizar
            render(criteria);
        }

        // Sistema de Checkout (WhatsApp Directo)
        function checkout(name, price) {
            const phoneNumber = "5215555555555"; // TU NUMERO AQUÍ
            const message = `Hola Kyomu, quiero comprar: ${name} (Precio: $${price})`;

            const whatsappUrl = `https://wa.me/${phoneNumber}?text=${encodeURIComponent(message)}`;
            window.open(whatsappUrl, '_blank');
        }

        // Iniciar
        render();

    </script>
</body>

</html>
